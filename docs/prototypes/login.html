<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniEcoClaw · 数智大气平台登录</title>
<link rel="stylesheet" href="duty-proto.css">
<style>
/* ============================================================
   登录页原型（复刻 LoginView.vue 结构，仅保留数智大气平台登录）
   ============================================================ */
.login-view {
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-primary);
  padding: 20px;
  box-sizing: border-box;
}
.login-card {
  width: 480px;
  max-width: 100%;
  padding: 56px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  text-align: center;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
}
.login-logo {
  margin-bottom: 24px;
  display: flex;
  justify-content: center;
}
.login-logo .logo-wrap {
  width: 80px;
  height: 80px;
  border-radius: var(--radius-md);
  background: #fff;
  border: 1px solid var(--border-color);
  display: grid;
  place-items: center;
  overflow: hidden;
}
.login-logo .logo-wrap img {
  width: 68px;
  height: 68px;
  object-fit: contain;
}
.login-title {
  font-size: 26px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 16px;
  letter-spacing: .2px;
}
.login-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 28px;
}
/* 平台品牌标签（仅平台登录，替代原来的 tab 切换） */
.login-platform-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  margin-bottom: 28px;
  border-radius: 24px;
  background: rgba(var(--accent-primary-rgb), .08);
  color: var(--accent-primary);
  font-size: 12.5px;
  font-weight: 500;
}
.login-platform-badge svg {
  width: 14px;
  height: 14px;
}
/* 登录表单 */
.login-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
  text-align: left;
}
.login-input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 15px;
  color: var(--text-primary);
  background: var(--bg-input);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  box-sizing: border-box;
  font-family: var(--font-ui);
}
.login-input::placeholder {
  color: var(--text-muted);
}
.login-input:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(var(--accent-primary-rgb), .08);
}
.login-input-wrap {
  position: relative;
}
.login-input-wrap .input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-muted);
}
.login-input-wrap .login-input {
  padding-left: 42px;
}
/* 错误提示 */
.login-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(var(--error-rgb), .06);
  border: 1px solid rgba(var(--error-rgb), .25);
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  color: var(--error);
  line-height: 1.5;
}
.login-error svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  margin-top: 1px;
}
.login-error.hidden {
  display: none;
}
/* 锁定/重置提示 */
.login-lock-hint {
  padding: 10px 12px;
  border: 1px solid rgba(var(--warning-rgb), 0.35);
  border-radius: var(--radius-sm);
  background: rgba(var(--warning-rgb), 0.08);
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.5;
  text-align: left;
}
.login-lock-hint code {
  display: block;
  margin-top: 4px;
  color: var(--text-primary);
  font-family: var(--font-code);
  word-break: break-all;
  background: rgba(var(--warning-rgb), .06);
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11.5px;
}
.login-lock-hint.hidden {
  display: none;
}
/* 登录按钮 */
.login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--accent-primary);
  color: var(--text-on-accent);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, opacity .15s;
  font-family: var(--font-ui);
  letter-spacing: .5px;
}
.login-btn:hover:not(:disabled) {
  background: var(--accent-hover);
}
.login-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.login-btn .loading {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.login-btn .spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
/* 底部帮助链接 */
.login-foot {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-muted);
}
.login-foot a {
  color: var(--accent-primary);
  text-decoration: none;
  font-weight: 500;
}
.login-foot a:hover {
  text-decoration: underline;
}
/* 平台集成横幅 */
.platform-note {
  margin-top: 18px;
  padding: 12px 14px;
  background: var(--bg-secondary);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.platform-note svg {
  width: 16px;
  height: 16px;
  color: var(--accent-primary);
  flex-shrink: 0;
}
.platform-note b {
  color: var(--text-primary);
  font-weight: 600;
}
@media (max-width: 520px) {
  .login-card { padding: 32px 24px; }
  .login-title { font-size: 22px; }
}
</style>
</head>
<body>
<div class="login-view">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-wrap">
        <img src="logo.png" alt="UniEcoClaw">
      </div>
    </div>
    <h1 class="login-title">UniEcoClaw 登录</h1>
    <div class="login-subtitle">通过数智大气平台账号进入值守智能助手</div>

    <!-- 仅平台登录提示徽章（替代原来的 tab 切换） -->
    <div class="login-platform-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>
      </svg>
      数智大气平台 统一登录
    </div>

    <!-- 登录表单（仅保留平台账号登录） -->
    <form class="login-form" id="loginForm" onsubmit="return doLogin(event)">
      <!-- 账号输入 -->
      <div class="login-input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" class="login-input" placeholder="请输入数智大气平台账号" autofocus />
      </div>

      <!-- 密码输入 -->
      <div class="login-input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" class="login-input" placeholder="请输入平台密码" onkeyup="if(event.key==='Enter') doLogin(event)" />
      </div>

      <!-- 错误提示 -->
      <div class="login-error hidden" id="errorBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMsg">账号或密码错误</span>
      </div>

      <!-- 锁定提示 -->
      <div class="login-lock-hint hidden" id="lockHint">
        <span>登录尝试过多已被临时锁定，请使用以下命令重置：</span>
        <code>hermes-web-ui clear-login-locks --restart</code>
      </div>

      <!-- 提交按钮 -->
      <button type="submit" class="login-btn" id="submitBtn">
        <span id="btnText">登 录</span>
      </button>
    </form>

    <!-- 底部帮助 -->
    <div class="login-foot">
      <span>© 2026 UniEcoClaw</span>
      <a href="#" onclick="showToast('联系平台管理员获取账号')">无法登录？联系管理员</a>
    </div>

    <!-- 平台集成说明 -->
    <div class="platform-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
      </svg>
      <div>账号体系由 <b>数智大气平台</b> 统一托管，密码通过 SM2 国密算法前端加密传输；登录成功后将跳转至值守对话首页。</div>
    </div>
  </div>
</div>

<!-- Toast 复用原型底座 -->
<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
/**
 * 显示错误提示条
 * @param {string} msg 错误内容
 */
function showError(msg) {
  const box = document.getElementById('errorBox');
  const msgEl = document.getElementById('errorMsg');
  msgEl.textContent = msg || '登录失败，请重试';
  box.classList.remove('hidden');
}

/** 隐藏错误提示 */
function hideError() {
  document.getElementById('errorBox').classList.add('hidden');
}

/** 显示/隐藏锁定提示 */
function toggleLockHint(show) {
  document.getElementById('lockHint').classList.toggle('hidden', !show);
}

/**
 * 设置登录按钮状态：loading / normal
 * @param {boolean} loading 是否加载中
 */
function setBtnLoading(loading) {
  const btn = document.getElementById('submitBtn');
  const txt = document.getElementById('btnText');
  if (loading) {
    btn.disabled = true;
    txt.innerHTML = '<span class="loading"><span class="spinner"></span>登录中...</span>';
  } else {
    btn.disabled = false;
    txt.innerHTML = '登 录';
  }
}

/**
 * 原型登录提交逻辑（仅演示：成功/失败两种状态）
 * 输入任意非空账号密码即跳转对话页，空值则提示错误
 * @param {Event} e form submit event
 */
function doLogin(e) {
  if (e) e.preventDefault();
  hideError();
  toggleLockHint(false);

  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;

  if (!u || !p) {
    showError('请输入平台账号与密码');
    return false;
  }

  // 原型演示：密码长度 < 4 视为错误演示
  if (p.length < 4) {
    showError('平台账号或密码错误，请重新输入');
    return false;
  }

  // 原型演示：密码是 "lock" 则展示锁定提示
  if (p === 'lock') {
    toggleLockHint(true);
    showError('登录尝试次数过多，账号已临时锁定');
    return false;
  }

  // 进入加载态，1.2s 后跳转至对话首页
  setBtnLoading(true);
  setTimeout(() => {
    setBtnLoading(false);
    // 原型：登录成功进入对话首页
    location.href = 'duty-chat.html';
  }, 1200);

  return false;
}

// 复用原型 toast（供帮助链接点击使用）
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
