<body>
<div class="app">
  <!-- 左侧栏（1:1 复刻 ChatPanel: session-list + PageSidebarNav + JobTreeList） -->

    <div class="page-sidebar-top">
      <div class="page-sidebar-nav">

          <div>
            <div class="logo-text">envClaw</div>
            <div class="logo-tag">数智环保 · envClaw</div>
          </div>
        </div>
        <div class="mode-switch-tabs">
          <button class="mode-tab" onclick="showToast('智能问数模块（原型未覆盖）')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>智能问数</span></button>
          <button class="mode-tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>自动化值守</span></button>
        </div>
      </div>
      <div class="sidebar-action-bar">
        <a class="sidebar-primary-btn" href="duty-create.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>新建任务</span></a>
      </div>
    </div>
    <div class="session-sections-scroll">
      <div class="session-section">
        <div class="session-group-header">
          <span class="session-group-label">历史对话</span>
          <span class="session-group-count">(7)</span>
          <svg class="group-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <a class="session-item active"><span class="session-item-title">新对话</span><span class="session-item-time">11:06</span></a>
        <a class="session-item"><span class="session-item-title">平顶山值守任务 · 07/28 运行分析</span><span class="session-item-time">10:19</span></a>
        <a class="session-item"><span class="session-item-title">[运行结果上下文] # City…</span><span class="session-item-time">7月27日</span></a>
        <a class="session-item"><span class="session-item-title">[运行结果上下文] # City…</span><span class="session-item-time">7月27日</span></a>
        <a class="session-item"><span class="session-item-title">[运行结果上下文] # City…</span><span class="session-item-time">7月23日</span></a>
        <button class="session-more-btn">查看更多（2）</button>
      </div>
      <div class="session-section">
        <div class="session-group-header">
          <span class="session-group-label">定时任务</span>
          <span class="session-group-count">(1)</span>
          <svg class="group-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="tree-job-group">
          <div class="tree-job-row" onclick="location.href='duty-tasks.html'">
            <span class="tree-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
            <div class="tree-job-info">
              <span class="tree-job-name">平顶山值守任务</span>
              <span class="tree-job-status success">已调度</span>
            </div>
            <span class="tree-job-settings" onclick="event.stopPropagation();location.href='duty-create.html?edit=a'" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          </div>
        </div>
      </div>
    </div>
    <div class="page-sidebar-bottom">
      <button class="page-sidebar-menu-btn" onclick="showToast('打开设置')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>设置</span></button>
    </div>
  </aside>

  <!-- 内容区 -->
  <div class="content">
    <div class="page">
      <div class="page-header">
        <div>
          <h1>值守任务</h1>
          <div class="page-sub">无人值守的定时任务，按计划自动运行并推送结果</div>
        </div>
        <div class="page-actions">
          <a class="btn btn-primary" href="duty-create.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>创建任务</a>
        </div>
      </div>

      <!-- 顶部分段切换 -->
      <div class="seg-switch">
        <a class="seg-btn active" href="duty-tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>我的任务 <span class="seg-count">4</span></a>
        <a class="seg-btn" href="duty-capabilities.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>能力库 <span class="seg-count">4</span></a>
      </div>

      <!-- 筛选条（复刻 JobCardList） -->
      <div class="filter-bar">
        <div class="filter-pill active" data-f="all" onclick="setFilter('all')">全部 <span class="num" id="cAll">0</span></div>
        <div class="filter-pill" data-f="running" onclick="setFilter('running')"><span class="dot" style="background:var(--success)"></span>运行中 <span class="num" id="cRunning">0</span></div>
        <div class="filter-pill" data-f="paused" onclick="setFilter('paused')"><span class="dot" style="background:var(--warning)"></span>已暂停 <span class="num" id="cPaused">0</span></div>
        <div class="filter-pill" data-f="error" onclick="setFilter('error')"><span class="dot" style="background:var(--error)"></span>异常 <span class="num" id="cError">0</span></div>
        <div class="filter-bar-right">
          <div class="search-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="jobSearch" placeholder="搜索任务名称..." oninput="renderJobs()">
          </div>
        </div>
      </div>

      <div class="card-grid" id="jobGrid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
// 任务 mock（字段对齐 api/hermes/jobs.ts Job）
const jobs = [
  { id:'a', name:'平阴县每日城市排名分析任务', state:'running', enabled:true, last_status:'ok', schedule:'0 9 * * *', schedule_display:'每天 09:00', deliver:'wecom', next_run:'今日 09:00', last:'成功', lastCls:'success' },
  { id:'b', name:'国控点小时数据播报任务', state:'running', enabled:true, last_status:'ok', schedule:'0 * * * *', schedule_display:'每小时', deliver:'wecom', next_run:'10:00', last:'成功', lastCls:'success' },
  { id:'c', name:'污染源超标异常监控', state:'running', enabled:true, last_status:'error', schedule:'*/15 * * * *', schedule_display:'每 15 分钟', deliver:'dingtalk', next_run:'—', last:'账号凭证失效', lastCls:'error' },
  { id:'d', name:'周报自动生成', state:'paused', enabled:false, last_status:null, schedule:'0 18 * * 1', schedule_display:'每周一 18:00', deliver:'local', next_run:'—', last:'—', lastCls:'' },
];
const deliverLabel = { wecom:'企业微信', dingtalk:'钉钉', feishu:'飞书', local:'本地', origin:'原路返回' };
let jobFilter = 'all';

function statusOf(j){
  if (j.state==='paused' || !j.enabled) return ['已暂停','paused'];
  if (j.last_status && j.last_status!=='ok') return ['异常','error'];
  if (j.state==='running') return ['运行中','running'];
  return ['已调度','scheduled'];
}
function counts(){
  return {
    all: jobs.length,
    running: jobs.filter(j=>j.enabled&&j.state!=='paused'&&(j.last_status===null||j.last_status==='ok')).length,
    paused: jobs.filter(j=>j.state==='paused'||!j.enabled).length,
    error: jobs.filter(j=>j.last_status&&j.last_status!=='ok').length,
  };
}
function setFilter(f){
  jobFilter=f;
  document.querySelectorAll('.filter-pill').forEach(p=>{ p.classList.remove('active','running','paused','error'); if(p.dataset.f===f){ p.classList.add('active'); if(f!=='all') p.classList.add(f); }});
  renderJobs();
}
function renderJobs(){
  const c = counts();
  cAll.textContent=c.all; cRunning.textContent=c.running; cPaused.textContent=c.paused; cError.textContent=c.error;
  const kw = document.getElementById('jobSearch').value.trim().toLowerCase();
  let list = jobs.filter(j=>{
    if(jobFilter==='running') return j.enabled&&j.state!=='paused'&&(j.last_status===null||j.last_status==='ok');
    if(jobFilter==='paused') return j.state==='paused'||!j.enabled;
    if(jobFilter==='error') return j.last_status&&j.last_status!=='ok';
    return true;
  });
  if(kw) list=list.filter(j=>j.name.toLowerCase().includes(kw));
  document.getElementById('jobGrid').innerHTML = list.length ? list.map(j=>{
    const [label,cls]=statusOf(j);
    const isPaused=j.state==='paused'||!j.enabled;
    const hasErr=j.last_status&&j.last_status!=='ok';
    return `<div class="job-card">
      <div class="card-head"><div class="card-title">${j.name}</div><span class="status-pill ${cls}"><span class="pill-dot"></span>${label}</span></div>
      <div class="card-body">
        <div class="info-row"><span class="label">调度频率</span><span class="val mono">${j.schedule_display}</span></div>
        <div class="info-row"><span class="label">推送渠道</span><span class="val">${deliverLabel[j.deliver]||'—'}</span></div>
        <div class="info-row"><span class="label">下次运行</span><span class="val ${j.next_run!=='—'?'highlight-time':''}">${j.next_run}</span></div>
        ${j.last!=='—'?`<div class="info-row"><span class="label">上次运行</span><span class="val ${j.lastCls}">${j.last}</span></div>`:''}
      </div>
      <div class="card-actions">
        ${isPaused
          ? `<button class="act-btn act-primary" onclick="showToast('任务已恢复')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>恢复</button>`
          : `<button class="act-btn act-primary" onclick="showToast('任务已触发')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>立即运行</button>`}
        ${!isPaused&&!hasErr?`<button class="act-btn" onclick="showToast('任务已暂停')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>暂停</button>`:''}
        <a class="act-btn ${hasErr?'act-danger':''}" href="duty-create.html?edit=${j.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>${hasErr?'修复':'编辑'}</a>
        <button class="act-btn act-danger" onclick="showToast('删除确认')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>删除</button>
      </div>
    </div>`;
  }).join('') : `<div class="empty-state">没有匹配的任务</div>`;
}
let tTimer=null;
function showToast(msg){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg; t.classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(()=>t.classList.remove('show'),2000); }
renderJobs();
</script>
</body>
</html>
