        <a class="session-item"><span class="session-item-title">[运行结果上下文] # City…</span><span class="session-item-time">7月27日</span></a>
        <a class="session-item"><span class="session-item-title">[运行结果上下文] # City…</span><span class="session-item-time">7月23日</span></a>

  <!-- 内容区 -->
  <div class="content">

          <div class="page-sub">浏览可值守的成果能力，快速创建或组合成一个复合任务</div>
        </div>
        <div class="page-actions">
          <a class="btn btn-primary" href="duty-create.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>创建任务</a>
        </div>
      </div>

      <!-- 顶部分段切换 -->
      <div class="seg-switch">

        <a class="seg-btn active" href="duty-capabilities.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>能力库 <span class="seg-count">4</span></a>
      </div>

      <div class="cap-source">数智大气</div>

      <div class="cap-grid" id="capGrid"></div>
    </div>
  </div>
</div>

<!-- 组合篮 -->
<div class="combo-bar" id="comboBar">
  <div class="combo-info"><span class="combo-num" id="comboNum">0</span> 已选成果</div>
  <div class="combo-chips" id="comboChips"></div>
  <button class="combo-clear" onclick="clearCombo()">清空</button>
  <a class="combo-go" id="comboGo" href="duty-create.html">去组合配置 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
</div>

<!-- 快速创建改为直接进入正式创建向导，轻量弹窗已移除 -->

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
// 真实四成果模型（源自 CreateTask.vue functions[] szdq + dutyOutputs）
const CAPS = {
  mapPackage:          { mono:'◇', name:'一张图', tags:['截图','地图'], desc:'生成数智大气一张图成果，设置地图范围、时间类型、监测图/插值图、因子、风场与图层。' },
  concentrationRanking:{ mono:'≋', name:'浓度排名', tags:['截图','数据采集','数据分析'], desc:'城市/站点浓度排名查询，生成可视化排名截图并附数据文字总结后推送。' },
  hourlyBrief:         { mono:'◷', name:'小时播报', tags:['截图','数据采集','数据分析'], desc:'定位小时播报页面，勾选行政区与污染因子，截取页面图片。' },
  monitoringData:      { mono:'▦', name:'监测数据', tags:['截图','数据采集','数据分析'], desc:'提取各点位小时/分钟监测数据，覆盖 PM₂.₅、AQI、O₃ 等，按站点结构化输出。' },
};
const CAP_KEYS = ['mapPackage','concentrationRanking','hourlyBrief','monitoringData'];
const svgCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>';

let comboSet = new Set();
function goCreate(k){ window.location.href='duty-create.html?caps='+encodeURIComponent(k); }

function renderCaps(){
  document.getElementById('capGrid').innerHTML = CAP_KEYS.map(k=>{
    const c=CAPS[k]; const inC=comboSet.has(k);
    return `<div class="cap-card ${inC?'in-combo':''}" onclick="toggleCombo('${k}')">
      <div class="cap-top">
        <div class="cap-name">${c.name}</div>
        <div class="cap-combo-check" title="${inC?'移出组合':'加入组合'}" onclick="event.stopPropagation();toggleCombo('${k}')">${svgCheck}</div>
      </div>
      <div class="cap-desc">${c.desc}</div>
      <div class="cap-tags">${c.tags.map(t=>`<span class="cap-tag">${t}</span>`).join('')}</div>
      <div class="cap-foot">
        <button class="act-btn act-primary" onclick="event.stopPropagation();goCreate('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>快速创建</button>
        <button class="act-btn" onclick="event.stopPropagation();toggleCombo('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>${inC?'已加入组合':'加入组合'}</button>
      </div>
    </div>`;
  }).join('');
}
function toggleCombo(k){ comboSet.has(k)?comboSet.delete(k):comboSet.add(k); renderCaps(); renderCombo(); }
function clearCombo(){ comboSet.clear(); renderCaps(); renderCombo(); }
function renderCombo(){
  document.getElementById('comboNum').textContent=comboSet.size;
  document.getElementById('comboChips').innerHTML=[...comboSet].map(k=>`<span class="combo-chip">${CAPS[k].name}<button onclick="toggleCombo('${k}')">×</button></span>`).join('');
  document.getElementById('comboBar').classList.toggle('show', comboSet.size>0);
  document.getElementById('comboGo').href = 'duty-create.html?caps=' + encodeURIComponent([...comboSet].join(','));
}
let tTimer=null;
function showToast(msg){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg; t.classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(()=>t.classList.remove('show'),2000); }
renderCaps();
</script>
</body>
</html>
