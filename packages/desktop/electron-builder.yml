appId: com.envclaw.desktop
productName: Envclaw
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build


# Don't auto-prune our root node_modules; we curate `files` and `extraResources` ourselves.
buildDependenciesFromSource: false
nodeGypRebuild: false
npmRebuild: false

# Auto-update: publish provider is set to "generic" so that electron-builder
# generates latest-mac.yml / latest.yml for auto-update discovery.
# The actual feedURL is set at runtime in updater.ts based on platform,
# so the url here is a placeholder — electron-updater overrides it via setFeedURL().
publish:
  provider: generic
  url: https://www.mapairs.com/datacenter/claw/updates
  channel: latest

files:
  - "dist/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,LICENSE,LICENSE.txt,license,*.d.ts}"
  - "!**/node_modules/.bin"
  - "!**/{.DS_Store,.git,.gitignore,.eslintrc*,.prettierrc*,*.map,tsconfig.json}"

# Web UI source (built dist) lives outside the asar. Python/Node/Git runtime
# assets are downloaded into the user's Web UI home on first launch.
# This package lives at packages/desktop, so ../.. is the hermes-web-ui repo root.
extraResources:
  - from: "build"
    to: "build"
    filter:
      - "icon.png"
      - "icon.ico"
      - "trayTemplate.png"
      - "trayWindows.png"
      - "runtime-release.json"
  - from: "../.."
    to: "webui"
    filter:
      - "package.json"
      - "bin/**"
      - "dist/**"
      - "node_modules/**"
      # Drop other-platform node-pty prebuilds (saves ~45MB)
      - "!node_modules/node-pty/prebuilds/!(${platform}-${arch})/**"
      - "!node_modules/node-pty/build/**"
      - "!packages/desktop/**"
      - "!**/{.git,.github,docs,tests,playwright.config.ts,README*,scripts,*.map}"
      - "!node_modules/**/*.md"

asarUnpack:
  - "**/*.node"

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  artifactName: "Claw-${version}-${arch}.${ext}"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Claw-${version}-${arch}.${ext}"

linux:
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]   # fpm has no arm64 binary; deb only on x64
  category: Development
  artifactName: "Claw-${version}-${arch}.${ext}"

deb:
  afterInstall: build/linux-after-install.tpl
  afterRemove: build/linux-after-remove.tpl

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: build/installer.nsh
